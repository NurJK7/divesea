<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — DiveSea</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="container page">
    <section class="panel panel--wide">
      <h1 class="page-title">Contact us</h1>
      <p class="muted">Have a question about DiveSea? Send us a message and we will get back to you.</p>
      <form id="contact-form" novalidate>
        <div class="two-cols">
          <div>
            <label class="label" for="c-name">Name</label>
            <input class="input" id="c-name" autocomplete="name">
          </div>
          <div>
            <label class="label" for="c-email">Email</label>
            <input class="input" id="c-email" type="email" autocomplete="email">
          </div>
        </div>
        <label class="label" for="c-topic">Topic</label>
        <select class="input" id="c-topic">
          <option>General question</option>
          <option>Problem with a purchase</option>
          <option>Account and profile</option>
          <option>Partnership</option>
        </select>
        <label class="label" for="c-message">Message</label>
        <textarea class="input" id="c-message" rows="6" maxlength="1000"></textarea>
        <p class="error" id="c-error" role="alert"></p>
        <button class="btn btn--dark" type="submit">Send message</button>
      </form>
      <p class="note">support@divesea.example · Mon–Fri, 9:00–18:00</p>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
